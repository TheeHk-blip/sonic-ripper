[package]
name = "sonic-core"
version.workspace = true
edition.workspace = true
description = "Shared download engine for Sonic Ripper (desktop app and CLI)"

[dependencies]
chrono = "0.4"
directories = "6.0.0"
once_cell = "1"
regex = "1"
reqwest = { version = "0.11", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
url = "2"
zip = "9.0.5"
