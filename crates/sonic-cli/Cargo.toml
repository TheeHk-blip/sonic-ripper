[package]
name = "sonic-cli"
version.workspace = true
edition.workspace = true
description = "Command-line frontend for Sonic Ripper"

[[bin]]
name = "sonic-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
indicatif = "0.18.6"
serde_json = "1"
sonic-core = { path = "../sonic-core" }
tokio = { version = "1.53.1", features = ["full"] }

# Aarch64 Linux is cross-compiled in CI, where the host pkg-config cannot find
# a target OpenSSL. Build it from source for that target only.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
