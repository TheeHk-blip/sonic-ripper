name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            rust-target: 'x86_64-unknown-linux-gnu'
            args: ''
          - platform: 'windows-latest'
            rust-target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            rust-target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.rust-target }}
          cache: true

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf \
            build-essential \
            curl wget file \
            libfuse2 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Download sidecar binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-tauri/binaries
          gh release download sidecar-binaries-v1 \
            --repo ${{ github.repository }} \
            --dir src-tauri/binaries \
            --pattern "sonic-ffmpeg-*" \
            --pattern "sonic-yt-dlp-*" \
            --clobber

      - name: Ensure sidecar binaries are executable
        if: matrix.platform != 'windows-latest'
        run: chmod +x src-tauri/binaries/sonic-yt-dlp-* src-tauri/binaries/sonic-ffmpeg-*

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_EMBED_WORKER_URL: ${{ secrets.VITE_EMBED_WORKER_URL }}
          EXCLUDE_LIBS: 'libwayland-client.so.0'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sonic Ripper v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify GStreamer plugins were bundled
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found to verify"
            exit 1
          fi
          echo "Extracting $APPIMAGE to check for bundled GStreamer plugins"
          "$APPIMAGE" --appimage-extract > /dev/null

          PLUGIN_DIR=$(find squashfs-root -type d -iname "gstreamer-1.0" | head -n 1)
          if [ -z "$PLUGIN_DIR" ]; then
            echo "::error::No gstreamer-1.0 plugin directory found in bundled AppImage — video/audio playback will fail at runtime"
            rm -rf squashfs-root
            exit 1
          fi

          echo "Found plugin directory: $PLUGIN_DIR"
          ls -la "$PLUGIN_DIR"

          PLUGIN_COUNT=$(find "$PLUGIN_DIR" -name "*.so" | wc -l)
          echo "Bundled $PLUGIN_COUNT GStreamer plugin(s)"
          if [ "$PLUGIN_COUNT" -lt 1 ]; then
            echo "::error::gstreamer-1.0 directory exists but contains no .so plugins"
            rm -rf squashfs-root
            exit 1
          fi

          # Sanity-check for the specific decoders YouTube embeds need
          for lib in libgstlibav libgstvpx libgstopus; do
            if ! find "$PLUGIN_DIR" -iname "${lib}*.so" | grep -q .; then
              echo "::warning::Expected plugin '$lib' not found in bundle — some codecs may be missing"
            fi
          done

          rm -rf squashfs-root

      - name: Fix bundled AppImage (strip conflicting Wayland lib)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping."
            exit 0
          fi
          echo "Checking $APPIMAGE for bundled libwayland-client.so.0"
          "$APPIMAGE" --appimage-extract > /dev/null
          if [ -f squashfs-root/usr/lib/libwayland-client.so.0 ]; then
            echo "Found bundled libwayland-client.so.0 — removing and repackaging"
            rm -f squashfs-root/usr/lib/libwayland-client.so.0
            wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
            chmod +x appimagetool
            ./appimagetool squashfs-root "$APPIMAGE"
            echo "REPACKAGED=true" >> "$GITHUB_ENV"
          else
            echo "libwayland-client.so.0 not bundled — EXCLUDE_LIBS worked, nothing to fix"
            echo "REPACKAGED=false" >> "$GITHUB_ENV"
          fi
          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_ENV"
          rm -rf squashfs-root appimagetool

      - name: Re-upload fixed AppImage to draft release
        if: matrix.platform == 'ubuntu-22.04' && env.REPACKAGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Re-uploading repackaged AppImage to release ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" "$APPIMAGE_PATH" --repo ${{ github.repository }} --clobber
