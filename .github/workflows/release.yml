name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            rust-target: 'x86_64-unknown-linux-gnu'
            args: ''
          - platform: 'windows-latest'
            rust-target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            rust-target: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.rust-target }}
          cache: true

      - name: Ensure both macOS targets installed
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf \
            build-essential \
            curl wget file \
            libfuse2

      - name: Download sidecar binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-tauri/binaries
          gh release download sidecar-binaries-v1 \
            --repo ${{ github.repository }} \
            --dir src-tauri/binaries \
            --pattern "sonic-ffmpeg-*" \
            --pattern "sonic-yt-dlp-*" \
            --clobber

      - name: Ensure sidecar binaries are executable
        if: matrix.platform != 'windows-latest'
        run: chmod +x src-tauri/binaries/sonic-yt-dlp-* src-tauri/binaries/sonic-ffmpeg-*

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sonic Ripper v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
