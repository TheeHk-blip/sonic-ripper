name: Husky

# Enforces the same gates as the local husky hooks (see .husky/),
# so PRs can't bypass them with `git commit --no-verify`.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        # Runs the `prepare` script (`husky`), installing the git hooks
        run: pnpm install --frozen-lockfile

      - name: Verify husky hooks are installed
        run: test -x .husky/pre-commit

      - name: Lint (pre-commit gate)
        run: pnpm lint

      - name: Format check (pre-commit gate)
        run: pnpm format:check

      - name: Typecheck + build
        run: pnpm build
